# Rux Kernel Configuration File
#
# This file defines kernel compilation options and feature settings
# Run `cargo build` to recompile kernel after modifications

[general]
# Kernel name
name = "Rux"
# Version number
version = "0.1.0"
# Developer info
authors = ["Rux Developers"]

[platform]
# Target platform: "aarch64", "x86_64", "riscv64"
default_platform = "riscv64"
# Enabled platforms
enable_aarch64 = false
enable_x86_64 = false
enable_riscv64 = true

[memory]
# Kernel heap size (MB) - must be power of 2 (16, 32, 64...)
kernel_heap_size = 32
# Physical memory size (MB)
physical_memory = 2048
# Page size
page_size = 4096
# User stack size (MB)
user_stack_size = 8
# Max page tables (fork needs to copy entire page table)
max_page_tables = 1024
# User stack max size (bytes) - 8MB
user_stack_max_size = 8388608
# User heap max size (bytes) - 128MB
user_heap_max_size = 134217728
# Enable swap support
enable_swap = true
# Swap size (MB) — carved from end of block device
swap_size_mb = 256
# Kernel stack size (bytes) - 32KB
kernel_stack_size = 32768
# Buddy allocator max order
buddy_max_order = 20
# Slab cache count
slab_num_caches = 10
# Per-CPU page cache high watermark
pcp_high = 64
# Per-CPU page cache low watermark
pcp_low = 16
# Per-CPU page cache batch size
pcp_batch = 16

[smp]
# Enable multi-core support (SMP)
enable_smp = true
# Maximum CPU count
max_cpus = 4
# SMP boot stack size (bytes) - 64KB
boot_stack_size = 65536

[scheduler]
# Enable scheduler
enable_scheduler = true
# Default time slice (milliseconds)
default_time_slice_ms = 100
# Time slice ticks
time_slice_ticks = 10
# Maximum number of tasks
max_tasks = 256
# Load imbalance threshold for SMP balancing
load_imbalance_thresh = 2
# CFS minimum granularity (nanoseconds) - 0.7ms
cfs_min_granularity_ns = 700000
# CFS scheduling latency (nanoseconds) - 6ms
cfs_latency_ns = 6000000
# Kernel HZ (timer interrupts per second)
kernel_hz = 100

[network]
# Enable network stack
enable_network = true
# Ethernet MTU
eth_mtu = 1500
# TCP socket table size
tcp_socket_table_size = 64
# UDP socket table size
udp_socket_table_size = 64
# ARP cache size
arp_cache_size = 64
# Route table size
route_table_size = 64
# IPv4 default TTL
ip_default_ttl = 64
# TCP minimum RTO (microseconds) - 200ms
tcp_rto_min_us = 200000
# TCP maximum RTO (microseconds) - 120s
tcp_rto_max_us = 120000000
# TCP default RTO (microseconds) - 1s
tcp_rto_default_us = 1000000
# TCP maximum retransmit count
tcp_max_retries = 15
# TCP delayed ACK timeout (microseconds) - 40ms
tcp_delack_timeout_us = 40000
# TCP TIME_WAIT timeout (microseconds) - 60s
tcp_timewait_timeout_us = 60000000

[boot]
# Enable graphics output
graphics = false
# Enable early debug output
early_debug = true
# Enable self-test
self_test = false

# Mount configuration
[mount]
# ext4 disk mount point (default is root directory)
# ext4 disk is automatically mounted to this path at boot
ext4_mount_point = "/"
# Enable ext4 auto-mount
auto_mount_ext4 = true
# Enable procfs auto-mount
auto_mount_procfs = true

[drivers]
# Driver support
enable_uart = true
enable_timer = true
enable_gic = false
enable_virtio = false
enable_pci = false
# VirtIO network device probing
enable_virtio_net_probe = true
# Maximum VirtIO devices
virtio_max_devices = 8
# VirtIO queue wait timeout (microseconds) - 10s
virtio_queue_timeout_us = 10000000
# VirtIO device reset timeout (ticks)
virtio_reset_timeout_ticks = 100000
# VirtIO PCI max capabilities
virtio_pci_max_capabilities = 48
# Maximum PLIC interrupts
plic_max_interrupts = 128
# Event device queue size
evdev_event_queue_size = 64
# Timer clock frequency (Hz) - 10 MHz
timer_clock_freq_hz = 10000000

# Feature enables
[features]
# Network stack sub-features
enable_tcp = true
enable_udp = true
enable_arp = true
enable_ipv4 = true
enable_ethernet = true
# System features
enable_signal = true
enable_vm = true
# Filesystem features
enable_vfs = true
enable_pipe = true

[filesystem]
# Pipe buffer size (bytes) - 16KB
pipe_buffer_size = 16384
# Inode cache size
icache_size = 256
# Directory entry cache size
dcache_size = 256
# Rootfs path cache size
rootfs_path_cache_size = 64
# Maximum symlink follow depth
max_symlinks = 40
# Maximum symlink depth in ext4
ext4_max_symlink_depth = 8

[process]
# Maximum PID value (4M)
pid_max_limit = 4194304
# Default maximum PID value (bitmap allocator range)
pid_max_default = 32768
# Reserved PIDs: 0..reserved_pids are never allocated
reserved_pids = 300
# Maximum command line length
max_cmdline_len = 2048
# File descriptor set size for select
fd_setsize = 1024

[sync]
# Futex waiter pool size
futex_waiter_pool_size = 256
# Futex hash table size
futex_hash_size = 64

[graphics]
# Default framebuffer width
fb_default_width = 1024
# Default framebuffer height
fb_default_height = 768

# Debug options
[debug]
# Enable debug output
debug_output = true

# Printk configuration
[printk]
# Ring buffer size (bytes) - default 1MB
ring_buffer_size = 1048576
# Enable profiling
profiling = false
# Enable memory tracing
memory_trace = false
# Enable IRQ tracing
irq_trace = false
# Log level: "error", "warn", "info", "debug", "trace"
log_level = "info"

# Performance tuning
[performance]
# Optimization level: 0-3
opt_level = 3
# Enable LTO (link-time optimization)
lto = true
# Codegen units (1 = better optimization, larger binary)
codegen_units = 1
# Strip local symbols
strip = true

# Security options
[security]
# Enable stack protector
stack_protector = false
# Enable bounds checking
bounds_check = true
# Enable overflow checking
overflow_check = true
