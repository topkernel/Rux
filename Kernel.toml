# Rux Kernel Configuration File
#
# This file defines kernel compilation options and feature settings
# Run `cargo build` to recompile kernel after modifications

[general]
# Kernel name
name = "Rux"
# Version number
version = "0.1.0"
# Developer info
authors = ["Rux Developers"]

[platform]
# Target platform: "aarch64", "x86_64", "riscv64"
default_platform = "riscv64"
# Enabled platforms
enable_aarch64 = true
enable_x86_64 = false
enable_riscv64 = true

[memory]
# Kernel heap size (MB) - must be power of 2 (16, 32, 64...)
kernel_heap_size = 32
# Physical memory size (MB)
physical_memory = 2048
# Page size
page_size = 4096
# User stack size (MB)
user_stack_size = 8
# Max page tables (fork needs to copy entire page table)
max_page_tables = 1024

[smp]
# Enable multi-core support (SMP)
enable_smp = true
# Maximum CPU count
max_cpus = 4

[scheduler]
# Enable scheduler
enable_scheduler = true
# Default time slice (milliseconds)
default_time_slice_ms = 100
# Time slice ticks
time_slice_ticks = 10

[network]
# Enable network stack
enable_network = true
# Ethernet MTU
eth_mtu = 1500
# TCP socket table size
tcp_socket_table_size = 64
# UDP socket table size
udp_socket_table_size = 64
# ARP cache size
arp_cache_size = 64
# Route table size
route_table_size = 64
# IPv4 default TTL
ip_default_ttl = 64

[boot]
# Enable graphics output
graphics = false
# Enable early debug output
early_debug = true
# Enable self-test
self_test = false

# Mount configuration
[mount]
# ext4 disk mount point (default is root directory)
# ext4 disk is automatically mounted to this path at boot
ext4_mount_point = "/"
# Enable ext4 auto-mount
auto_mount_ext4 = true
# Enable procfs auto-mount
auto_mount_procfs = true

[drivers]
# Driver support
enable_uart = true
enable_timer = true
enable_gic = false
enable_virtio = false
enable_pci = false
# VirtIO network device probing
enable_virtio_net_probe = true

# Feature enables
[features]
# Network stack sub-features
enable_tcp = true
enable_udp = true
enable_arp = true
enable_ipv4 = true
enable_ethernet = true
# System features
enable_signal = true
enable_vm = true
# Filesystem features
enable_vfs = true
enable_pipe = true

# Debug options
[debug]
# Enable debug output
debug_output = true
# Enable profiling
profiling = false
# Enable memory tracing
memory_trace = false
# Enable IRQ tracing
irq_trace = false
# Log level: "error", "warn", "info", "debug", "trace"
log_level = "info"

# Performance tuning
[performance]
# Optimization level: 0-3
opt_level = 3
# Enable LTO (link-time optimization)
lto = true
# Codegen units (1 = better optimization, larger binary)
codegen_units = 1
# Strip local symbols
strip = true

# Security options
[security]
# Enable stack protector
stack_protector = false
# Enable bounds checking
bounds_check = true
# Enable overflow checking
overflow_check = true
