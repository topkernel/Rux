## 测试环境配置

### 启用内核单元测试

Rux 使用 `unit-test` feature 来控制测试编译：

```bash
# 启用单元测试进行构建
cargo build --package rux --features riscv64,unit-test

# 运行测试
qemu-system-riscv64 -M virt -cpu rv64 -m 2G -nographic \
  -kernel target/riscv64gc-unknown-none-elf/debug/rux
```

### 正常构建（不包含测试）

```bash
# 正常构建，不包含测试代码
make build

# 或者直接使用 cargo
cargo build --package rux --features riscv64
```

### 测试环境

| 项目 | 配置 |
|------|------|
| **QEMU** | 6.2.0+（RISC-V 64 位） |
| **目标平台** | riscv64gc-unknown-none-elf |
| **CPU** | 4 核（QEMU virt 机器） |
| **内存** | 2 GB |
| **MMU** | Sv39（三级页表） |

## 内核单元测试

### 测试框架

Rux 是一个 `no_std` 内核，无法使用标准库的 `#[test]` 和 `cargo test`。它使用自定义测试框架：

**框架位置**: `kernel/src/tests/mod.rs`

**核心组件**:
- `test_pass(name)` - 记录测试通过
- `test_fail(name, reason)` - 记录测试失败
- `test_skip(name, reason)` - 记录测试跳过
- `test_group_start(name)` - 开始测试组
- `test_assert!()` - 断言宏（失败时不产生 panic）
- `test_assert_eq!()` - 相等断言宏

**测试入口**: `run_all_tests()` 函数

## Linux LTP 测试套件

官方 LTP（Linux Test Project）测试套件提供全面的内核兼容性测试。

**位置**: `userspace/linux-ltp/`

**LTP 版本**: 20240524

### 编译统计

使用 musl libc 交叉编译，我们实现了：

| 类别 | 已编译 | 预期 | 比率 |
|------|--------|------|------|
| **总计** | **1,838** | 1,826 | **101%** |
| 系统调用测试 | 1,378 | 1,367 | 101% |
| 内存测试 | 108 | 108 | 100% |
| 容器 | 46 | 46 | 100% |
| 控制器 | 20 | 39 | 51% |
| 文件系统测试 | 29 | 29 | 100% |
| 安全测试 | 24 | 24 | 100% |
| 调度器测试 | 23 | 23 | 100% |
| I/O 测试 | 19 | 19 | 100% |

### 已知限制

部分测试因 glibc 特有结构而无法使用 musl 编译：

- `fmtmsg` - 需要 `addseverity()`（glibc 扩展）
- `ioctl` - 需要 `struct termio`（glibc 特有）
- `timer_create` - 需要 `struct sigevent._sigev_un`（glibc 内部）
- `statx` - 需要 `stx_mnt_id` 字段（更新版本的内核）
- `rt_tgsigqueueinfo` - 需要 `siginfo_t._sifields`（glibc 内部）

### 构建 Linux LTP

```bash
cd userspace/linux-ltp
./build.sh
```

依赖要求：
- `riscv64-linux-gnu-gcc` - RISC-V 交叉编译器
- musl libc SDK（通过项目根目录的 `make sdk` 构建）

### 运行 Linux LTP

在 Rux shell 中：

```bash
# 运行快速测试套件（仅关键测试）
/test/linux-ltp/run_quick.sh

# 运行系统调用测试
/test/linux-ltp/run_syscalls.sh

# 运行完整 LTP 套件
/test/linux-ltp/run_ltp.sh
```

### 添加到 Rootfs

构建完成后，运行 `make rootfs` 将测试包含在 rootfs 镜像中。测试将安装到 `/test/linux-ltp/` 目录下。

## 添加新测试

### 添加内核单元测试

1. **创建测试文件** `kernel/src/tests/my_feature.rs`：

```rust
use crate::tests::{test_pass, test_fail, test_group_start};

pub fn test_my_feature() {
    test_group_start("my_feature");

    // 测试用例 1
    if some_condition {
        test_pass("test_case_1");
    } else {
        test_fail("test_case_1", "reason");
    }

    // 测试用例 2
    test_assert!(another_condition, "test_case_2");
}
```

2. **注册测试** 在 `kernel/src/tests/mod.rs` 中：

```rust
#[cfg(feature = "unit-test")]

## 测试最佳实践

### 测试命名规范

| 类型 | 命名格式 |
|------|----------|
| 测试文件 | `test_<module>.rs` 或 `<feature>.rs` |
| 测试函数 | `test_<feature>()` |
| 测试组 | `test_group_start("<module_name>")` |
| 测试用例 | 描述性名称，例如 "basic_fork_success" |

### 测试结构

```rust
pub fn test_feature() {
    test_group_start("feature");

    // 1. 基本功能
    test_assert!(basic_check(), "basic_functionality");

    // 2. 边界条件
    test_assert_eq!(edge_case(), expected, "edge_case");

    // 3. 错误处理
    test_assert!(error_handled(), "error_handling");
}
```

### 需要避免的问题

| 问题 | 描述 |
|------|------|
| 全局状态依赖 | 每个测试应独立初始化 |
| 大对象栈分配 | 使用 Box 进行堆分配 |
| 复杂的 drop 操作 | 可能触发 PANIC |

### 安全操作

| 操作 | 描述 |
|------|------|
| Box 分配 | 单对象堆分配 |
| 简单栈分配 | 基本类型、小数组 |
| 整数运算 | 无内存操作 |

## 已知限制

### 1. Vec Drop PANIC

**问题**: `Vec` 离开作用域时释放内存可能触发 PANIC

**变通方案**: 跳过 Vec drop 相关测试，仅测试基本操作

### 2. 无法使用 cargo test

**原因**: Rux 是一个 `no_std` 内核

**解决方案**: 使用自定义测试框架，在 QEMU 中运行

### 3. 资源池限制

**问题**: 部分测试（如多次 fork）受限于静态资源池

**解决方案**: 测试边界条件后跳过，或实现动态资源分配
