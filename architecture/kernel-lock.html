# 内核大锁

## 概述

Rux 内核目前使用内核大锁（BKL，Kernel Big Lock）作为其主要同步机制。这是一个粗粒度锁，确保在任何给定时间只有一个 CPU 可以执行内核代码。

## 设计目标

1. **简洁性**：使用单一锁简化了早期内核开发中的并发控制
2. **正确性优先**：避免细粒度锁导致的死锁和数据竞争
3. **渐进式优化**：为未来的锁拆分提供清晰的演进路径

## 当前实现

### 架构图

```
+-----------------------------------------------------------------+
|                        用户空间进程                               |
|  +----------+  +----------+  +----------+  +----------+         |
|  | 进程 A   |  | 进程 B   |  | 进程 C   |  | 进程 D   |         |
|  +----+-----+  +----+-----+  +----+-----+  +----+-----+         |
+-------+-------------+-------------+-------------+---------------+
        | syscall/    | 缺页中断    | 中断        | syscall
        | trap        |             |             |
        v             v             v             v
+-----------------------------------------------------------------+
|                    KERNEL_LOCK (自旋锁)                           |
|  +---------------------------------------------------------+   |
|  |  ACQUIRE ------------------------------------- RELEASE |   |
|  |    |                                               |     |   |
|  |    v                                               v     |   |
|  |  +-------------------------------------------------+   |   |
|  |  |              内核临界区                          |   |   |
|  |  |  - 系统调用处理                                   |   |   |
|  |  |  - 缺页中断处理                                   |   |   |
|  |  |  - 中断处理                                       |   |   |
|  |  |  - 调度器操作                                     |   |   |
|  |  +-------------------------------------------------+   |   |
|  +---------------------------------------------------------+   |
+-----------------------------------------------------------------+
```

### 锁生命周期

```
用户态执行
    |
    v
+-------------+
| trap_entry  | --- KERNEL_LOCK_ACQUIRE ---> 获取锁
+-------------+
    |
    v
+-------------+
| trap_handler| --- 处理 syscall/异常/中断
+-------------+
    |
    v
+-------------+
| trap_exit   |
+-------------+
    |
    v
+-------------+
|return_user  | --- KERNEL_LOCK_RELEASE ---> 释放锁
+-------------+
    |
    v
用户态执行
```

### 代码实现

#### 1. 锁变量定义 (kernel/src/sync/kernel_lock.rs)

```rust
/// 全局内核大锁（简单自旋锁）
#[no_mangle]
pub static mut KERNEL_LOCK: AtomicBool = AtomicBool::new(false);

/// 检查内核大锁当前是否被持有
#[inline]
pub fn is_locked() -> bool {
    unsafe { KERNEL_LOCK.load(Ordering::Acquire) }
}
```

#### 2. 汇编宏 (kernel/src/arch/riscv64/trap.S)

```asm
// KERNEL_LOCK_ACQUIRE - 获取内核大锁
// 使用 amoswap.w.aq 指令，带有 acquire 语义
.macro KERNEL_LOCK_ACQUIRE
    la t0, KERNEL_LOCK
    li t2, 1
1:
    amoswap.w.aq t1, t2, (t0)    // 原子交换
    bnez t1, 1b                   // 自旋等待
.endm

// KERNEL_LOCK_RELEASE - 释放内核大锁
// 使用 amoswap.w.rl 指令，带有 release 语义
.macro KERNEL_LOCK_RELEASE
    la t0, KERNEL_LOCK
    amoswap.w.rl zero, zero, (t0)  // 原子写入 0
.endm
```

#### 3. 使用位置

| 位置 | 操作 | 说明 |
|------|------|------|
| trap_entry（用户 -> 内核） | ACQUIRE | 进入内核时获取锁 |
| trap_exit -> .Lreturn_user | RELEASE | 返回用户态时释放锁 |
| ret_from_fork -> .Lret_from_fork_user | ACQUIRE + RELEASE | fork 子进程首次调度 |
| handle_timer_interrupt | is_locked() | 持锁时跳过调度 |
| handle_page_fault | RELEASE + schedule | 进程终止时释放锁后再调度 |
| Task::sleep | RELEASE + schedule + ACQUIRE | 睡眠前释放锁，唤醒后重新获取锁 |
| do_exit | RELEASE + schedule | 进程退出时释放锁 |

### 睡眠/阻塞处理

当系统调用需要睡眠（等待 I/O、futex、信号量等）时，必须：
1. **释放内核大锁**：允许其他进程执行
2. **调用 schedule()**：切换到其他进程
3. **唤醒后重新获取锁**：继续执行系统调用

```rust
// 睡眠函数模板
pub fn sleep(state: TaskState) {
    // 设置睡眠状态
    current.set_state(state);

    // 释放内核大锁
    crate::sync::kernel_lock_release();

    // 调度让出 CPU
    crate::sched::schedule();

    // 唤醒后重新获取内核大锁
    crate::sync::kernel_lock_acquire();
}
```

已处理的睡眠点：
- `Task::sleep()` - 通用睡眠函数
- `wait_event!` / `wait_event_interruptible!` - 等待队列宏
- `ConditionVariable::wait()` - 条件变量
- `Semaphore::down()` - 信号量 P 操作
- `futex_wait()` - Futex 等待
- `pipe_file_read()` / `pipe_file_write()` - 管道读/写
- `do_exit()` - 进程退出
- `yield_cpu()` - 主动让出 CPU
- `handle_pending_signals()` - 信号处理中的 STOP 状态

### 内核入口/出口路径分析

#### 入口路径（用户态 -> 内核态）

| 路径 | 锁操作 | 说明 |
|------|--------|------|
| trap_entry -> .Lfrom_user | ACQUIRE | 正常的系统调用/异常/中断 |
| trap_entry -> .Lfrom_kernel | 无 | 内核态中断，无需获取锁 |
| trap_entry -> .Learly_boot | 无 | 早期启动阶段 |
| ret_from_fork -> .Lret_from_fork_user | ACQUIRE | fork 子进程首次调度 |
| switch_to_user（context_switch） | 无 | init 进程，从内核态启动 |

#### 出口路径（内核态 -> 用户态）

| 路径 | 锁操作 | 说明 |
|------|--------|------|
| trap_exit -> .Lreturn_user | RELEASE | 正常返回用户态 |
| trap_exit -> .Lreturn_kernel | 无 | 返回内核态 |
| ret_from_fork -> .Lret_from_fork_user | RELEASE | fork 子进程返回用户态 |
| switch_to_user（context_switch） | 无 | init 进程首次进入用户态 |

#### 特殊路径

1. **init 进程启动**：
   - 从 `init.rs` 创建，`ctx.sp = 0`
   - 通过 `context_switch` -> `switch_to_user` 启动
   - 不经过 trap 入口，因此不获取锁
   - 在首次 trap 时正常获取锁

2. **fork 子进程**：
   - 从 `ret_from_fork` 开始执行
   - 首先获取锁（模拟 trap 入口），然后释放锁（返回用户态）
   - 确保锁状态与正常 trap 一致

3. **进程睡眠/唤醒**：
   - 睡眠前释放锁，唤醒后重新获取锁
   - 确保睡眠期间其他进程可以获取锁

### 关键设计决策

#### 1. 为什么使用汇编宏而不是 Rust 函数？

最初使用 Rust 函数实现，但这导致了用户空间程序执行异常。原因是函数调用影响了寄存器状态（可能是由于编译器优化或调用约定问题）。

**解决方案**：直接在 trap.S 中使用内联汇编实现锁操作，避免函数调用开销和潜在的寄存器状态问题。

#### 2. 内存序

- **ACQUIRE**：使用 `.aq` 修饰符，确保获取锁之后的内存操作不会被重排到获取锁之前
- **RELEASE**：使用 `.rl` 修饰符，确保释放锁之前的内存操作不会被重排到释放锁之后

#### 3. 调度器保护

当内核大锁被持有时，定时器中断处理不会触发调度：

```rust
fn handle_timer_interrupt(regs: &mut PtRegs) {
    let is_locked = crate::sync::is_locked();
    // ... 处理定时器 ...
    if crate::sched::need_resched() && !is_locked {
        crate::sched::schedule();  // 仅在未持锁时进行调度
    }
}
```

## 性能影响

### 当前局限性

1. **等效于单核**：即使在多核系统上，也只有一个核心可以执行内核代码
2. **长临界区**：锁在整个系统调用期间被持有，阻塞其他 CPU
3. **中断延迟**：其他 CPU 上的中断必须等待锁释放

### 适用场景

- 早期内核开发
- 单核或双核系统
- 功能验证阶段

## 锁拆分计划

### 阶段 1：中断上下文分离

**目标**：允许中断处理程序并行执行

**方案**：
```
当前：
  KERNEL_LOCK -------------------------------------
              |    syscall    | interrupt | syscall |
              +---------------+----------+---------+

拆分后：
  KERNEL_LOCK ---------------+-------+-------------
              |    syscall    |       |   syscall   |
              +---------------+       +-------------+
  IRQ_LOCK    -----------------------+-------------
                              | intr  |    intr     |
                              +-------+------------+
```

**要求**：
- 引入 `IRQ_LOCK` 保护中断处理
- 中断处理程序不访问共享数据或使用单独的锁

### 阶段 2：子系统独立锁

**目标**：不同子系统可以并行执行

**方案**：
```
+-------------------------------------------------------------+
|                      锁层次结构                                |
+-------------------------------------------------------------+
|  +-------------+  +-------------+  +-------------+          |
|  | SCHED_LOCK  |  |  MM_LOCK    |  |  FS_LOCK    |  ...     |
|  | 调度器       |  | 内存管理     |  | 文件系统     |          |
|  +-------------+  +-------------+  +-------------+          |
+-------------------------------------------------------------+
|  +-------------+  +-------------+  +-------------+          |
|  | PIPE_LOCK   |  | SOCKET_LOCK |  | SIGNAL_LOCK |  ...     |
|  | 管道         |  | 网络        |  | 信号        |          |
|  +-------------+  +-------------+  +-------------+          |
+-------------------------------------------------------------+
```

**锁粒度规划**：

| 子系统 | 锁名称 | 保护内容 |
|--------|--------|----------|
| 调度器 | `sched_lock` | 运行队列、进程状态 |
| 内存管理 | `mm_lock` | 页表、VMA、地址空间 |
| 文件系统 | `fs_lock` | inode、dentry、superblock |
| 块设备 | `bio_lock` | 缓冲区缓存 |
| 网络 | `net_lock` | socket、协议栈 |
| 信号 | `signal_lock` | 信号处理、待处理信号 |

### 阶段 3：细粒度锁

**目标**：每个数据结构拥有自己的锁

**方案**：

```rust
// 进程级锁
struct Task {
    lock: SpinLock,      // 保护单个进程字段
    // ...
}

// inode 级锁
struct Inode {
    lock: RwLock,        // 读写锁，允许多个读者单个写者
    // ...
}

// 每 CPU 数据（无需锁）
struct PerCpu<T> {
    data: [T; MAX_CPUS],  // 每个 CPU 独立访问
}
```

### 阶段 4：RCU（Read-Copy-Update）

**目标**：无锁读操作

**适用场景**：
- 路径查找（dentry 缓存）
- 进程列表遍历
- 网络路由表

**方案**：
```
写操作：
  1. 复制数据
  2. 修改副本
  3. 原子替换指针
  4. 等待宽限期后释放旧数据

读操作：
  1. 直接读取（无需锁）
  2. 使用 rcu_read_lock/unlock 标记临界区
```

## 锁拆分实施指南

### 步骤 1：识别共享数据

```bash
# 查找全局静态变量
grep -rn "static" kernel/src --include="*.rs" | grep -v "static fn"

# 查找潜在的竞争条件
grep -rn "unsafe" kernel/src --include="*.rs"
```

### 步骤 2：确定锁层次结构

1. **绘制依赖图**：识别哪些子系统相互依赖
2. **定义锁顺序**：避免死锁，始终以相同顺序获取锁
3. **编写文档**：记录每个锁的用途和获取顺序

### 步骤 3：渐进式替换

```rust
// 1. 添加新锁
static SCHED_LOCK: SpinLock = SpinLock::new();

// 2. 在持锁代码中使用新锁
fn schedule() {
    let _guard = SCHED_LOCK.lock();
    // 原有代码...
}

// 3. 移除内核大锁（在确认安全后）
// KERNEL_LOCK 不再保护调度器
```

### 死锁预防

**锁顺序规则**（从外到内）：
1. `KERNEL_LOCK`（最终将被移除）
2. `SCHED_LOCK`
3. `MM_LOCK`
4. `FS_LOCK`
5. `INODE_LOCK`
6. `PAGE_LOCK`

**禁止行为**：
- 以相反顺序获取锁
- 在持锁期间调用可能获取其他锁的函数（除非明确允许）
