# Rux 设计原则

## 最高原则（绝对不可违反）

### **0. 完整的 POSIX/ABI 兼容性**

这是 Rux 内核开发的**最高指导原则**。所有设计和实现决策都必须遵循这一原则。

- **核心要求**：
  - **100% POSIX 兼容**：完全遵守 POSIX 标准（IEEE Std 1003.1）
  - **完整的 Linux ABI 兼容性**：与 Linux 内核 ABI 二进制兼容
  - **系统调用兼容性**：系统调用号、参数和返回值必须与 Linux 完全一致
  - **文件系统兼容性**：支持 Linux 文件系统格式（ext4）
  - **ELF 格式兼容性**：可执行文件格式与 Linux 完全相同

- **设计理念**：
  - **外部接口必须与 Linux 100% 兼容**（系统调用、数据结构、文件格式）
  - **内部实现是一个黑盒**——可以使用任何设计方法、任何算法、任何数据结构
  - 只要外部接口保持兼容，内部设计拥有完全的自由度

- **实现方法**：
  - 外部接口必须与 Linux 完全一致
  - 内部实现可以使用任何方法——传统的、创新的或混合的
  - 使用相同的系统调用号（用于 ABI 兼容性）
  - 使用相同的结构体布局（用于用户-内核 ABI）
  - 使用相同的文件系统格式（用于数据兼容性）

- **参考资源**：
  - Linux man 手册页（`man 2 syscall`）——用于接口规范
  - POSIX 标准——用于 API 行为规范
  - Linux ABI 文档——用于数据结构布局

> **切记**：外部接口必须与 Linux 完全一致。内部实现完全自由——你可以使用最佳的设计方案，不受 Linux 内部架构的任何限制。

---

## 项目目标

Rux 是一个用 Rust 编写的**Linux 兼容操作系统内核**，旨在实现与 Linux 内核的**完全兼容**，包括：
- 完整的 POSIX API 支持
- Linux ABI 二进制兼容性
- 能够运行原生 Linux 用户空间程序

所有代码均使用 Rust 编写，除必要的平台特定汇编代码外。

---

## 核心设计原则

### 1. **Linux ABI 兼容性（最高优先级）**

所有外部接口、系统调用和用户可见的数据结构必须与 Linux 完全一致。

**检查清单**：
- [ ] 系统调用号是否与 Linux 一致？
- [ ] 数据结构布局是否与 Linux 一致（用于用户-内核 ABI）？
- [ ] 是否遵循了 POSIX 标准？
- [ ] 外部接口是否与 Linux 保持兼容？

**注意**：内部实现完全自由——可以使用任何设计方法。

### 2. **Rust 优先**

- **原则**：所有内核代码使用 Rust 编写，除必要的平台特定汇编代码外
- **理由**：
  - 内存安全：Rust 的所有权系统在编译时防止内存错误
  - 并发安全：类型系统防止数据竞争
  - 现代工具链：包管理、文档生成、测试框架
- **例外情况**：
  - 启动代码（boot.S）
  - 上下文切换（context.rs 中的裸函数）
  - 中断入口（trap.S）
  - 特权级切换

**注意**：使用 Rust 能够实现更好的内部实现。外部接口必须与 Linux 匹配，但内部代码可以充分利用 Rust 的全部潜力。

### 3. **平台抽象**

- **原则**：平台特定代码隔离在 `arch/` 目录中
- **结构**：
  ```
  kernel/src/arch/
  └── riscv64/        # RISC-V 64 位（唯一支持的架构）
  ```
- **平台抽象层**：
  - 统一的内存管理接口
  - 统一的中断处理框架
  - 统一的设备驱动接口

**注意**：ARM64（aarch64）架构已被移除，不再维护。

### 4. **模块化设计**

- **原则**：清晰的模块边界，便于开发和测试
- **模块划分**：
  - `arch/`：平台特定代码
  - `mm/`：内存管理
  - `process/`：进程管理
  - `fs/`：文件系统
  - `net/`：网络协议栈
  - `drivers/`：设备驱动
  - `sync/`：同步原语
  - `syscall/`：系统调用分发

**注意**：模块组织以清晰为原则。每个模块的内部设计相互独立。

### 5. **分层架构**

```
+-------------------------------------+
|     用户空间                          |
|     - Linux ELF 二进制文件             |
|     - musl libc                     |
+-------------------------------------+
|     系统调用接口                       |
|     - 100% Linux ABI 兼容           |
+-------------------------------------+
|     内核内部层                        |
|     - 任意设计方案                    |
|     - 针对 Rust 优化                  |
+-------------------------------------+
|     平台抽象层                        |
|     - riscv64（唯一支持的架构）        |
+-------------------------------------+
|     硬件                             |
+-------------------------------------+
```

**关键点**：外部接口必须与 Linux 匹配。内部层可以使用任何架构。

### 6. **渐进式实现**

- **原则**：从一个最小可运行内核开始，逐步添加功能
- **优先级**：
  1. 基础框架（启动、内存、中断）
  2. 进程管理（调度、上下文切换）
  3. 系统调用（用户/内核隔离）
  4. 文件系统（VFS + ext4）
  5. 网络协议栈
  6. 高级功能（IPC、信号、实时调度）
  7. GUI 支持

### 7. **测试驱动**

- **原则**：每个模块都应有对应的测试
- **测试类型**：
  - 内核单元测试（51 个测试文件）
  - mini-ltp 测试（24 个内核兼容性测试）
  - QEMU 集成测试
- **测试命令**：
  - `make test` - 运行内核单元测试
  - `cd /test/mini-ltp && ./run_tests.sh` - 运行兼容性测试

### 8. **完善的文档**

- **原则**：保持代码与文档同步
- **文档类型**：
  - API 文档（rustdoc）
  - 设计文档（本文件）
  - 进度跟踪（roadmap.md）
  - 用户文档（getting-started.md）
  - 调试报告（fork-exec-debug-report.md）

## POSIX/ABI 实现指南

### 系统调用实现

**必须**使用 Linux 系统调用号（RISC-V）：

```rust
// 直接使用 Linux RISC-V 系统调用号
pub const __NR_read: usize = 63;
pub const __NR_write: usize = 64;
pub const __NR_openat: usize = 56;
pub const __NR_close: usize = 57;
pub const __NR_exit: usize = 93;
pub const __NR_getpid: usize = 172;
// ... 完全按照 Linux 定义
```

**禁止**：
- 创建新的系统调用
- 修改系统调用号
- 更改系统调用参数

### 结构体布局

**必须**与 Linux 结构体完全一致：

```rust
// 必须与 Linux struct stat 完全一致
#[repr(C)]
pub struct Stat {
    pub st_dev: u64,
    pub st_ino: u64,
    pub st_mode: u32,
    pub st_nlink: u32,
    pub st_uid: u32,
    pub st_gid: u32,
    pub st_rdev: u64,
    pub __pad1: u64,
    pub st_size: i64,
    pub st_blksize: i32,
    pub __pad2: i32,
    pub st_blocks: i64,
    // ... 字段顺序、大小、对齐都必须一致
}
```

### 文件系统

**必须**支持 Linux 文件系统格式：
- ext4（已实现）
- ramfs（已实现）
- procfs（已实现）
- devfs（已实现）

**禁止**：
- 创建新的文件系统格式
- 修改现有格式（除非 Linux 也做了修改）

### 设备接口

**必须**使用 Linux 设备接口：
- 字符设备（`/dev/xxx`）
- 块设备（`/dev/vda`）
- 输入设备（`/dev/input/event0`）

**参考**：Linux `include/uapi/` 下的接口定义

---

## 实现检查清单

实现任何功能时，必须验证：

- [ ] 系统调用号与 Linux 匹配（用于 ABI 兼容性）
- [ ] 结构体布局与 Linux 匹配（用于用户-内核 ABI）
- [ ] 文件格式与 Linux 匹配（用于数据兼容性）
- [ ] 行为符合 POSIX 标准
- [ ] 阅读相关的 Linux man 手册页了解接口规范
- [ ] 外部接口与 Linux 保持兼容

**切记**：外部接口必须与 Linux 完全一致。内部实现完全自由。

---

## 技术约束

### 编译器
- Rust 版本：稳定版（Stable）
- 目标平台：riscv64gc-unknown-none-elf（唯一支持）

### 运行时
- 无标准库（no_std）
- 无运行时（手动实现 panic 处理）

### 安全性
- 尽可能将危险代码隔离在 unsafe 块中
- 显式标记所有 unsafe 代码
- 定期审查 unsafe 代码的正确性

---

## 性能目标

- **启动时间**：< 5 秒（QEMU virt）
- **上下文切换**：< 1us
- **中断延迟**：< 5us
- **系统调用**：< 100ns

---

## 贡献指南

### 代码风格
- 遵循官方 Rust 代码风格（rustfmt）
- 使用有意义的变量和函数名
- 适当的注释和文档

### 提交规范
- 遵循 [Conventional Commits](https://www.conventionalcommits.org/)
- 清晰的提交信息
- 单次提交只做一件事
- 提交前通过所有测试

### 审查流程
- 必须通过代码审查
- 所有测试必须通过
- 文档必须更新

---
