# Rux 内核项目结构

本文档描述 Rux 内核项目的目录结构和文件组织。

---

## 代码统计

**最后更新**: 2026-03-27

### 总体统计

| 指标 | 数值 |
|--------|-------|
| **源文件总数** | 222 (218 Rust + 3 汇编 + 1 链接脚本) |
| **代码总行数** | **约 74,800 行** |
| **内核二进制大小 (debug)** | 约 3 MB |

### 模块代码分布

| 模块 | 文件数 | 代码行数 | 占比 | 说明 |
|--------|-------|---------------|------------|-------------|
| **fs/** | 47 | 19,508 | 26.1% | 文件系统 (ext4, procfs, jbd2, VFS) |
| **syscall/** | 11 | 5,890 | 7.9% | 系统调用分派 |
| **arch/** | 25 | 8,555 | 11.4% | 架构相关 (RISC-V) |
| **drivers/** | 28 | 8,049 | 10.8% | 设备驱动 |
| **tests/** | 53 | 7,376 | 9.9% | 单元测试 |
| **mm/** | 19 | 7,553 | 10.1% | 内存管理 |
| **sched/** | 8 | 4,356 | 5.8% | 进程调度 |
| **net/** | 11 | 5,177 | 6.9% | 网络协议栈 |
| **process/** | 5 | 2,624 | 3.5% | 进程管理 |
| **sync/** | 5 | 1,156 | 1.5% | 同步原语 |
| **顶层** | 11 | 4,565 | 6.1% | 主入口、控制台、配置等 |

### 测试统计

| 测试类型 | 数量 | 说明 |
|-----------|-------|-------------|
| **内核单元测试** | 53 个文件 | 内存、进程、文件系统、网络等 |
| **mini-ltp 测试** | 24 个测试 | 内核兼容性测试 |
| **Linux LTP 测试** | 1,838 个测试 | 官方 LTP 测试套件 (系统调用、内存、文件系统等) |
| **总计** | **1,915 个测试** | 全面的内核兼容性覆盖 |

### kernel/ - 内核源代码

核心内核源代码，按功能模块组织。

#### kernel/src/syscall/ - 系统调用分派

系统调用分派模块，将系统调用路由到具体实现：

| 文件 | 功能 | 系统调用 |
|------|----------|--------------|
| **dispatch.rs** | 系统调用分发器 | 所有系统调用入口 |
| **file.rs** | 文件系统调用 | open, close, read, write, lseek, fstat, mkdir, unlink, chdir, getcwd 等 |
| **process.rs** | 进程系统调用 | execve, wait4, exit, getpid, getppid, clone 等 |
| **memory.rs** | 内存系统调用 | brk, mmap, munmap, mprotect 等 |
| **sched.rs** | 调度器系统调用 | sched_yield, nice 等 |
| **signal.rs** | 信号系统调用 | kill, signal, sigprocmask, rt_sigreturn 等 |
| **network.rs** | 网络系统调用 | socket, bind, listen, accept, connect, send, recv 等 |
| **io.rs** | I/O 系统调用 | poll, select, epoll, eventfd 等 |
| **time.rs** | 时间系统调用 | time, gettimeofday, nanosleep, clock_gettime 等 |
| **misc.rs** | 其他系统调用 | uname, sysinfo, set_tid_address 等 |

## 注意事项

1. **config.rs 是自动生成的** - 请勿手动编辑 `kernel/src/config.rs`，它由 `kernel/build.rs` 根据 `Kernel.toml` 自动生成。

2. **平台限制** - 目前仅支持 RISC-V 64 位架构。

3. **系统调用兼容性** - 使用 Linux 系统调用编号，完全兼容 POSIX/ABI。

4. **模块导出** - 添加新模块时，请确保在父模块的 `mod.rs` 中正确导出所需的接口。

5. **用户程序** - 使用 musl libc 静态链接，与内核 ABI 兼容。

6. **代码模型** - `.cargo/config.toml` 使用 `code-model = "medany"` 实现 PC 相对寻址 (VMA/LMA 链接所需)。
