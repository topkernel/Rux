# Rux 开发路线图与功能列表

## 项目概述

**当前状态**：第 28 阶段 - Linux 风格内存管理与启动重构

**最后更新**：2026-03-27

**支持架构**：RISC-V 64 位 (RV64GC) - 唯一支持的架构

**代码统计**：
- **源文件数**：222 个（218 个 Rust + 3 个汇编 + 1 个链接器脚本）
- **代码总行数**：约 74,800 行
- **内核单元测试**：53 个测试文件
- **mini-lTP 测试**：25 个内核兼容性测试

**设计理念**：
- 外部接口必须与 Linux ABI 100% 兼容
- 内部实现可以在不影响兼容性的前提下采用更优设计

---

## 图例

| 符号 | 含义 |
|--------|---------|
| ✅ | 已实现并已测试 |
| ⚠️ | 部分实现 / 部分测试 |
| ❌ | 未实现 / 未测试 |
| P0 | 核心功能，必须实现 |
| P1 | 重要功能，应当实现 |
| P2 | 增强功能，可以添加 |
| P3 | 高级功能，可选 |

## 开发阶段规划

### 第 1-5 阶段：基础内核 ✅
启动、异常处理、基本系统调用、内存管理、进程基础

### 第 6-10 阶段：核心功能 ✅
中断、SMP、同步、文件系统基础、ELF 加载器

### 第 11-15 阶段：高级功能 ✅
用户模式、进程完善、信号、管道/IPC、单元测试

### 第 16-17 阶段：高层功能 ✅
抢占式调度、块设备、ext4 文件系统

### 第 18 阶段：网络协议栈 ✅
SkBuff、Ethernet、ARP、IPv4、UDP、TCP、VirtIO-net、Socket 系统调用

### 第 18.5-18.6 阶段：内存重构 ✅
平台无关页映射、VirtIO 探测重构

### 第 19 阶段：现代 VirtIO PCI 与 Shell ✅
现代 VirtIO 1.0+ PCI 驱动、ext4 Extent 树、Shell 运行

### 第 20 阶段：多 Shell 支持 ✅
命令行参数解析修复、musl libc 工具链、多 Shell 支持

### 第 21 阶段：启动输出重构 ✅
启动日志美化、ASCII 艺术 Logo、内核版本信息

### 第 22 阶段：ProcFS、符号链接、toybox ✅
完整 ProcFS、ext4 符号链接、TLS 修复、toybox 集成

### 第 23 阶段：CFS 调度器、COW、图形 ✅
CFS 完善、写时复制、图形驱动、输入设备、GUI 应用

### 第 24 阶段：devfs、mini-ltp、代码清理 ✅
devfs 文件系统、25 个 mini-ltp 测试、VFS 路径解析、代码清理

### 第 25 阶段：TCP 可靠性与信号完善 ✅
TCP 重传机制、RTO 计算、信号机制完善

### 第 26 阶段：文档更新 ✅
架构文档（启动、内存、结构）、设计理念完善

### 第 27 阶段：Linux 风格内存管理重构 ✅
Zone 分配器 (DMA/DMA32/NORMAL/MOVABLE)、vmemmap、每 CPU 页集合、
memblock 早期分配器、三级页表分配、带引用计数的页描述符、
按需分页、栈按需扩展、COW 缺页处理、ASID 管理（9 位，最多 512 个）、
copy_kernel_mappings（VPN2 共享）、反向映射 (AnonVma)、
大页框架、每进程 fs_struct

### 第 28 阶段：Linux 风格启动与架构重构 ✅
boot.S 中的 MMU 跳板、VMA/LMA 链接器脚本、内核链接于
KERNEL_LINK_ADDR (0xffffffff80000000)、medany 代码模型、PtRegs 位于
内核栈顶、上下文切换中的 FPU 上下文保存/恢复、
sscratch/tp 协议、ret_from_fork 路径、uaccess.S 汇编、
JBD2 日志层（8 个模块）、sys_mkdirat/rmdir/unlinkat、
内核大锁、增强 ProcFS (/proc/pid/*、/proc/interrupts)
