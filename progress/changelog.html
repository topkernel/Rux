# Rux OS 更新日志

本文档记录 Rux 内核的重要变更和修复。

## [未发布]

### 2026-03-27

#### 文档更新

- 更新 roadmap.md 至 v6.0（阶段 28，222 个文件，约 74,800 行）
- 更新 README.md，修正统计数据和模块分布
- 更新 boot.md，记录 Linux 风格 MMU 跳板启动流程
- 更新 memory.md，记录重构后的内存管理系统

### 2026-03-22 ~ 2026-03-27

#### 阶段 28：Linux 风格启动与架构重构

**MMU 跳板启动** (kernel/src/arch/riscv64/boot.S)
- 内核链接地址为 KERNEL_LINK_ADDR (0xffffffff80000000) 而非物理地址
- VMA/LMA 链接器脚本：代码在虚拟地址运行，加载到物理地址
- boot.S 创建跳板页表（PGD + PMD 用于前 2MB），启用 MMU
- stvec 技巧：将 stvec 设为 VA，写入 satp 启用 MMU，陷入异常重定向到 VA
- 三阶段页表分配：早期（静态 BSS）→ Fixmap（memblock）→ 后期（buddy）
- medany 代码模型，用于跨 VA/PA 边界的 PC 相对寻址

**PtRegs 位于内核栈顶** (kernel/src/arch/riscv64/trap.S, pt_regs.rs)
- Linux 风格：PtRegs 始终位于 (kernel_stack_top - sizeof(PtRegs))
- sscratch/tp 协议用于陷入处理程序中的用户/内核模式检测
- ret_from_fork_user 和 ret_from_fork_kernel 汇编路径

**上下文切换重构** (kernel/src/arch/riscv64/context.rs)
- switch_mm：写入 SATP 完成页表切换
- __switch_to：通过汇编保存/恢复被调用者保存寄存器
- FPU 状态保存/恢复集成到 context_switch 中
- ThreadStruct 替换 CpuContext，用于架构特定的线程状态

**用户空间访问安全** (kernel/src/arch/riscv64/uaccess.rs, uaccess.S)
- copy_to_user/copy_from_user 带字对齐优化
- access_ok 检查用于所有系统调用中的用户指针验证
- ioctl、writev、execve 路径处理使用安全的用户空间访问

**JBD2 日志层** (kernel/src/fs/jbd2/)
- 8 个模块：types、journal、transaction、commit、recovery、checkpoint、revoke、mod
- 基于 Linux 内核 fs/jbd2/
- 事务开始/停止/扩展，脏元数据跟踪

**ext4 写操作** (kernel/src/fs/ext4/)
- 实现了 mkdirat、rmdir、unlinkat 系统调用
- 带块分配的目录创建/删除
- 目录操作中支持 Extent 感知的块查找
- 64 位块组描述符支持

**procfs 增强** (kernel/src/fs/procfs/)
- 模块化实现，独立文件（meminfo、cpuinfo、pid、loadavg、interrupts）
- /proc/interrupts 用于每 CPU 中断统计
- /proc/pid/ 条目（status、cmdline、stat、exe、cwd、environ、fd）

**其他修复**
- fix(mm)：防止 execve 通过共享 L1 条目损坏父进程页表
- fix(mm)：修复 fork/exec 中的页面引用计数和内核表共享问题
- fix(mm)：将 VPN2=1（PCI MMIO）映射复制到用户页表
- fix(trap)：修复用户空间程序的陷入返回和信号处理
- fix(sched)：修复 context_switch 的 FPU 恢复时机

### 2026-03-14 ~ 2026-03-22

#### 阶段 27：Linux 风格内存管理重构

**区域分配器** (kernel/src/mm/zone.rs)
- ZONE_DMA、ZONE_DMA32、ZONE_NORMAL、ZONE_MOVABLE 区域类型
- MAX_ORDER=10 buddy 系统（最大支持 4MB 分配）
- GFP 标志（GFP_KERNEL、GFP_USER）

**vmemmap** (kernel/src/mm/vmemmap.rs)
- Linux 风格的虚拟内存映射，用于页描述符
- O(1) pfn_to_page 转换，通过算术运算：VMEMMAP_START + (pfn - base_pfn) * sizeof(Page)

**每 CPU 页缓存集** (kernel/src/mm/pcp.rs)
- 每 CPU 页面缓存，用于快速分配
- alloc_page_pcp / free_page_pcp

**Memblock** (kernel/src/mm/memblock.rs)
- 早期内存预留系统
- phys_alloc 用于 buddy 就绪前的启动时页面分配

**页描述符** (kernel/src/mm/page_desc.rs)
- Page 结构体，包含 flags、refcount、order、mapping
- get_page() / put_page() 引用计数
- 匿名页面跟踪，用于 /proc/meminfo

**ASID 管理** (kernel/src/arch/riscv64/mm/asid.rs)
- 9 位 ASID（最多 512 个进程）
- 带有 CAS 的位图分配器
- 每进程 AsidContext，含代数计数器
- TLB 刷新操作：全部、按 ASID、按页面、按范围

**按需分页** (kernel/src/arch/riscv64/mm/page_fault.rs)
- 首次访问时分配匿名页面
- COW 缺页处理：检测 COW 位，分配新页面，复制数据，清除 COW
- 按需栈扩展（Linux 风格的向下增长）

**地址空间统一** (kernel/src/arch/riscv64/mm/memory_layout.rs)
- 兼容 Linux RISC-V Sv39 的地址空间布局
- PAGE_OFFSET = 0xffffffd600000000（线性映射）
- KERNEL_LINK_ADDR = 0xffffffff80000000（内核映射，VPN2[510]）
- VMEMMAP_START = 0xffffffc700000000
- VA_PA_OFFSET = PAGE_OFFSET - PHYS_MEMORY_BASE

**写时复制** (kernel/src/arch/riscv64/mm/mm_ops.rs)
- copy_kernel_mappings：VPN2[0..1] 新 L0 表，VPN2[256..511] 共享
- fork：将所有共享页面标记为 COW（PTE 位 8），清除 W 位
- free_user_page_tables：遍历 VPN2[0..255]，使用 put_page() 释放页面

**反向映射** (kernel/src/mm/rmap.rs)
- AnonVma、AnonVmaChain 用于跟踪哪些进程映射了物理页面
- try_to_unmap() 用于页面回收准备

**大页框架** (kernel/src/mm/hugepage.rs)
- PMD 和 PGD 大页分配/释放
- 对齐辅助函数（pmd_align、pgd_align）
- is_huge_pte() 检测

**调度器改进** (kernel/src/sched/)
- 多类调度器：stop、deadline (EDF+CBS)、RT (FIFO/RR)、fair (CFS)、idle
- 内核栈缓存（最多缓存 64 个栈）
- do_exit 重构，包含正确的 exit_mm/exit_files
- 内核大锁，用于 SMP 安全

**性能优化**
- kfree O(n) → O(1)，使用 cache_idx
- size_to_order O(log n) → O(1)，使用查找表
- current() 从 O(1) 带锁 → O(1) 无锁
- 移除特定地址刷新后的冗余全局 TLB 刷新

### 2026-02-27

#### CFS 调度器实现

**阶段 23：CFS 调度器**

实现了类 Linux 的 CFS（完全公平调度器），替换了原有的轮转调度器。

**CFS 核心实现** (kernel/src/sched/cfs.rs)
- SchedEntity - 调度实体（vruntime、权重、执行时间）
- CfsRunQueue - CFS 运行队列（按 vruntime 排序的 BTreeMap）
- LoadWeight - 进程权重（基于 nice 值）
- vruntime 计算 - 公平的 CPU 时间分配
- 时间片计算 - 基于权重和负载的 sched_slice()
- 抢占检查 - check_preempt() 检测是否需要抢占

**nice 值支持** (kernel/src/process/task.rs)
- nice 值到权重的映射（参考 Linux sched_prio_to_weight）
- set_nice() 方法更新调度权重
- PRIO_TO_WEIGHT 和 PRIO_TO_WMULT 查找表

**调度器集成** (kernel/src/sched/sched.rs)
- RunQueue 集成 CfsRunQueue
- pick_next_task_cfs() 选择 vruntime 最小的任务
- scheduler_tick() 更新 vruntime 并检查抢占
- enqueue/dequeue 任务管理

**关键参数**（参考 Linux）
- SCHED_MIN_GRANULARITY_NS = 700us（最小调度粒度）
- SCHED_LATENCY_NS = 6ms（目标调度周期）
- NICE_0_LOAD = 1024（默认权重）

#### 已知问题

**cshell 和 rust-shell 启动失败**
- 原因：musl libc 的 `__init_libc` 期望从栈上读取 argc/argv

- 影响：libc 程序尝试访问 argv[-1] 时发生缺页错误
- 解决方案：需要在 UserContext 中设置 argc/argv 和栈初始化

**RISC-V 系统调用完整实现**（阶段 10 完成）
- 实现了完整的系统调用处理框架

**核心功能**：
1. **陷入处理机制** (`kernel/src/arch/riscv64/trap.S`, `trap.rs`)
   - 使用 sscratch 寄存器在用户栈和内核栈之间快速切换
   - 在内核栈上保存 272 字节的 TrapFrame
   - 正确处理系统调用、异常和中断

2. **系统调用调度器** (`kernel/src/arch/riscv64/syscall.rs`)
   - 遵循 RISC-V Linux ABI 约定
   - 系统调用编号通过 a7 寄存器传递
   - 参数通过 a0-a5 寄存器传递
   - 返回值通过 a0 寄存器传递

3. **用户模式切换** (`kernel/src/arch/riscv64/usermode_asm.S`)
   - 使用 sret 指令从特权模式切换到用户模式
   - Linux 风格的单页表方式（无 satp 切换）
   - 正确设置 sstatus.SPP=0 确保返回用户模式

4. **用户程序支持** (`userspace/hello_world/`)
   - 实现 no_std 用户程序
   - 内联汇编系统调用包装函数
   - 自定义链接器脚本（user.ld）链接到用户空间地址

**技术细节**：

```assembly
# 陷入入口（简化）
trap_entry:
    mv t0, sp                      # 保存原始 sp
    csrrw sp, sscratch, sp          # 交换 sp 和 sscratch（切换到内核栈）
    addi sp, sp, -272              # 分配 TrapFrame
    sd t0, 0(sp)                   # 保存原始 sp
    # ... 保存寄存器 ...
    call trap_handler              # 调用 Rust 处理函数
    # ... 恢复寄存器 ...
    ld t0, 0(sp)                   # 加载原始 sp
    addi sp, sp, 272               # 释放 TrapFrame
    csrr t1, sscratch              # 读取内核栈指针
    mv sp, t0                      # 恢复原始 sp
    csrw sscratch, t1              # 恢复内核栈指针到 sscratch
    sret                           # 返回到用户/内核模式
```

- SYS_EXIT (93) - 进程退出
- SYS_GETPID (172) - 获取进程 ID

[ECALL:5D]             <- 系统调用 0x5D (93) = sys_exit
sys_exit: exiting with code 0  <- sys_exit 成功执行
]                      <- 汇编代码到达 sret
```

#### Bug 修复

**BuddyAllocator 伙伴地址越界修复**（提交 09c86dd）
- 修复 `free_blocks` 函数中合并伙伴块时的地址越界问题
- 添加伙伴地址边界检查，防止访问超出 heap_end 的内存
- 影响：解决了 FdTable 和 SimpleArc 测试中的缺页错误问题

**问题描述**：
- 释放 order 12（16MB）块时，伙伴地址计算为 0x81A00000
- 该地址正好是 heap_end，超出 MMU 映射范围
- 导致 Load page fault 错误

**修复方案**：
```rust
// 检查伙伴是否在堆范围内
let heap_start = self.heap_start.load(Ordering::Acquire);
let heap_end = self.heap_end.load(Ordering::Acquire);

if buddy_ptr < heap_start || buddy_ptr >= heap_end {
    // 伙伴超出堆范围，无法合并
    self.add_to_free_list(current_ptr as *mut BlockHeader, current_order);
    break;
}
```

**测试验证**：
- SimpleArc 分配测试通过
- FdTable 测试通过
- 不再出现缺页错误
