[package]
name = "syscall"
version = "0.1.0"
edition = "2021"

# The SYSCALL SERVICE CRATE (crate-flip M2, 2026-11-22): the 12 service
# files, #[path]-included from the framework side with ZERO moves; the
# crate-level forbid is the compiler-enforced service boundary.
#
# A member of the kernel-dir workspace (crate-flip M3-B).
[dependencies]
rux = { path = "../core", package = "rux-core", default-features = false }
debug = { path = "../debug", default-features = false }
ipc = { path = "../ipc", default-features = false }
# The sync union re-export (sync-upper lane): the exec path's fxrs_latch
# and the wedge-dump rwfz_dump_tgid live in sync now.
sync = { path = "../sync", default-features = false }
# The sched policy crate (shrink-stage sibling dep): the mmap/munmap
# cgroup memory-charge hooks moved to sched::cgroup_policy — direct
# sibling-crate calls, no hook row.
sched = { path = "../sched", default-features = false }
fs = { path = "../fs", default-features = false }
net = { path = "../net", default-features = false }
process = { path = "../process", default-features = false }
timer = { path = "../timer", default-features = false }
io_uring = { path = "../io_uring", default-features = false }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64", "net/riscv64", "fs/riscv64", "debug/riscv64", "process/riscv64", "sync/riscv64", "sched/riscv64"]
x86_64 = ["rux/x86_64", "net/x86_64", "fs/x86_64", "debug/x86_64", "process/x86_64", "sync/x86_64", "sched/x86_64"]
aarch64 = ["rux/aarch64", "net/aarch64", "fs/aarch64", "debug/aarch64", "process/aarch64", "sync/aarch64", "sched/aarch64"]
