[package]
name = "rux-signal"
version = "0.1.0"
edition = "2021"

# The SIGNAL POLICY SERVICE CRATE (crate-flip, the seed-core
# mechanism/policy split applied to signal): the send-path queueing
# core (coalescing, sig_ignored ordering, RLIMIT_SIGPENDING, wake
# decisions), the default-action table, the pid-namespace init
# delivery filter, the exec/fork handler-reset rules, the /proc
# SigIgn/SigCgt pair, and the user-originated sender-stamping entries
# — compiled under crate-level #![forbid(unsafe_code)]. The MECHANISM
# (the pending set and its queue on the task, the pt_regs frame
# build/restore, the wake path, the pinned pid-hash lookups, the
# schedule loop) stays in the framework crate; the policy consumes it
# through the published safe APIs and calls down through the crate
# root re-exports.
#
# Zero-move step: the policy file is a #[path]-include of the carved
# kernel/src/signal_policy.rs (not declared by the framework's module
# tree — this crate is its sole compilation home); the physical move
# is the later cosmetic step per the crate-plan recipe.
#
# NOTE on scope: the rt_sigprocmask HOW computation, rt_sigaction
# SA-flag semantics, sigaltstack validation, rt_sigqueueinfo argument
# validation and the kill permission checks were ALREADY crate-side
# (rux-syscall since rung 1); this crate takes the policy that
# remained in kernel/src/signal.rs.

[dependencies]
rux = { path = "..", default-features = false }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64"]
x86_64 = ["rux/x86_64"]
aarch64 = ["rux/aarch64"]
# Gates the guest test module + its run entry (make test forwards this
# from rux-bin's unit-test through the SERVICE-TEST SEAM).
unit-test = ["rux/unit-test"]
