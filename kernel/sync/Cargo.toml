[package]
name = "sync"
version = "0.1.0"
edition = "2021"

# The SYNC SERVICE CRATE (sync-upper lane): the sync subsystem's cold
# majority — the futex diagnostic/forensic family (futex_diag.rs) and
# the condvar — compiled under crate-level #![forbid(unsafe_code)].
# Depends on the rux framework lib (root re-exports + the SyncDiagHooks
# seam). The lock primitive interiors (spinlock/rwlock/seqlock/percpu/
# lockkey/edges/mutex/rwsem/semaphore/rcu/futex_pi) and the futex
# mechanism + futex_stuck_census + the trap-called fuxwatch machinery
# stay framework-side (the lane's stay verdicts).

[dependencies]
rux = { path = "../core", package = "rux-core", default-features = false }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64"]
x86_64 = ["rux/x86_64"]
aarch64 = ["rux/aarch64"]
unit-test = []
# Forwards the core's futex tracer feature: `debug_dump_futex_state` is
# compiled there only with it, and the `futex` module below re-exports it
# only with it as well (seed-core pass 2 spelled the old glob out).
debug-futex-trace = ["rux/debug-futex-trace"]
