[package]
name = "rux-ext4"
version = "0.1.0"
edition = "2021"

# The EXT4 SERVICE CRATE (crate-flip rung 5, the deepest fs consumer):
# ext4 + jbd2 sole-copied under crate-level #![forbid(unsafe_code)]
# (the fifth service column). The typed-view/copy floor the pair
# consumes stays framework-side (fs/ext4_edges.rs, INV-EXT-EDGE-1/2/3;
# bio's with_block/bh_data family; safety::bytes) per the flip recipe —
# the crate's files carry ZERO unsafe by construction. Registration
# fills the framework's Ext4Hooks table (rux-bin calls register_all
# before kmain); the mount-table rows register at the
# register_builtin_handlers boot point (the rux-fs 'R'-loop lesson).

[dependencies]
rux = { path = "..", default-features = false }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64"]
x86_64 = ["rux/x86_64"]
aarch64 = ["rux/aarch64"]
# Gates the guest test module + its run entry (make test forwards this
# from rux-bin's unit-test through the SERVICE-TEST SEAM).
unit-test = ["rux/unit-test"]
