# The kernel-dir workspace (crate-flip M3-B; seed-core-design 2c.1): the
# core package (core/, package `rux-core`, lib `rux`), the sixteen service
# crates named for their subsystem, and the composition bin. This file is
# the workspace root only — the core's own manifest is core/Cargo.toml.
# The repo-root workspace excludes kernel/ (it lists kernel as a member —
# swapped to exclude in the same change).
[workspace]
resolver = "2"
members = ["core", "bin", "syscall", "net", "sched", "fs", "drivers", "mm", "ext4", "ipc", "signal", "process", "debug", "timer", "io_uring", "sync"]
# A plain `cargo build` in kernel/ used to build the root package (the
# core lib). The root is a virtual manifest now, so the same default is
# stated here; the kernel binary itself is always built with `-p bin`.
default-members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Profiles live at the workspace root: cargo ignores the [profile] tables
# of a package that is not the root package.
[profile.dev]
panic = "abort"
debug-assertions = true

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true
