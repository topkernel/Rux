[package]
name = "rux-timer"
version = "0.1.0"
edition = "2021"

# The TIMER SERVICE CRATE (cold-four lane): the timer subsystem's COLD
# halves — the WW heartbeat report (the wildwatch census instrument's
# formatting half; its markers and statics stay framework-side), the
# DEL_DM lookup (the del-timer diagnostic ring's reader), and the
# nanosleep-iteration bump — compiled under crate-level
# #![forbid(unsafe_code)]. The TIMEKEEPING CORE (read_time, the tick,
# the wheel, nohz, the oneshot guards, calibration, wall-clock epoch)
# stays framework-side in kernel/src/timer.rs + kernel/src/timer/:
# the wheel and nohz clusters are the tick's data structures (called
# by name from timer.rs, a hot file, through 30+ sites — the type
# substrate rule), and the oneshot guards are types with framework
# users (futex/signal/task).

[dependencies]
rux = { path = "..", default-features = false }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64"]
x86_64 = ["rux/x86_64"]
aarch64 = ["rux/aarch64"]
unit-test = []
