[package]
name = "rux-net"
version = "0.1.0"
edition = "2021"

# The NET SERVICE CRATE (crate-flip rung 2): the network stack
# compiled under crate-level #![forbid(unsafe_code)] — the second
# service column. Depends on the rux framework lib (re-exports +
# hook table + socket-call surface from rux-syscall's sibling).

[dependencies]
rux = { path = "..", default-features = false }
rux-debug = { path = "../rux-debug", default-features = false }
rux-fs = { path = "../rux-fs", default-features = false }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64", "rux-debug/riscv64", "rux-fs/riscv64"]
x86_64 = ["rux/x86_64", "rux-debug/x86_64", "rux-fs/x86_64"]
aarch64 = ["rux/aarch64", "rux-debug/aarch64", "rux-fs/aarch64"]
# Gates the guest test module + its run entry (make test forwards this
# from rux-bin's unit-test through the SERVICE-TEST SEAM).
unit-test = ["rux/unit-test"]
