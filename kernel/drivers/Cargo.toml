[package]
name = "drivers"
version = "0.1.0"
edition = "2021"

# The DRIVERS SERVICE CRATE (crate-flip rung 4): the leaf driver files
# compiled under crate-level #![forbid(unsafe_code)] — the fourth
# service column. Depends on the rux framework lib (re-exports +
# the DriverHooks seam). Mechanism drivers (virtio transports, intc,
# timer/clockevent machinery, rtc timekeeping, the netdev/block/GPU
# registries, DRM's GEM allocator) stay framework-side; see
# docs/architecture/crate-plan.md and the rung's flip commit message
# for the movable-vs-stays census.

[dependencies]
rux = { path = "..", default-features = false }
process = { path = "../process", default-features = false }
ipc = { path = "../ipc", default-features = false }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64", "process/riscv64", "ipc/riscv64"]
x86_64 = ["rux/x86_64", "process/x86_64", "ipc/x86_64"]
aarch64 = ["rux/aarch64", "process/aarch64", "ipc/aarch64"]
