[package]
name = "debug"
version = "0.1.0"
edition = "2021"

# The OBSERVABILITY SERVICE CRATE (crate-flip rung: debug): the
# movable report/decode/publish half of the kernel's diagnostic tools —
# the syscost/fsw/mmprof/driftwatch/filerd report generators, the schbd
# heartbeat kthread and its wedge census, the reaper print arms, the
# softlockup lockup report, the lostpark ring dump, the spinwatch compat
# arm, the tracefs file publisher, and the SCM_RIGHTS tap — compiled
# under crate-level #![forbid(unsafe_code)]. The per-event RECORD
# markers and their statics stay in the framework crate
# (kernel/src/debug/) as direct calls (the hot/cold split of the flip's
# measurement); this crate READS those statics through their pub
# surfaces and prints. Framework-side cold entry points dispatch
# through kernel/src/debug/debug_hooks.rs (the 18-row seam); syscall
# and fs call the scmtap module here DIRECTLY (sibling service dep,
# zero indirection on the armed-gated tap paths).

[dependencies]
ipc = { path = "../ipc", default-features = false }
rux = { path = "..", default-features = false }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64", "ipc/riscv64"]
x86_64 = ["rux/x86_64", "ipc/x86_64"]
aarch64 = ["rux/aarch64", "ipc/aarch64"]
# Forwarded from bin's unit-test (kept for shape parity with the
# sibling service crates; no guest tests moved with this rung yet).
unit-test = ["rux/unit-test"]
