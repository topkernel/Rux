[package]
name = "rux-process"
version = "0.1.0"
edition = "2021"

# The PROCESS SERVICE CRATE (crate-flip rung: process): the movable
# process policy — fork/clone, the wait4/waitid family, exec's ELF
# policy, ptrace, coredump, reboot, kthread spawn/stop, the pid
# allocator — compiled under crate-level #![forbid(unsafe_code)].
# The framework keeps the MECHANISM the hot paths need (Task's type +
# slot mechanics in process/task.rs, task_ref/unsafe_edges/pid_hash,
# the WaitQueueHead family in process/wait.rs, the namespace types in
# process/ns.rs, and process/exit.rs's exit/reap machinery whose
# callers are the arch traps, signal delivery and the scheduler reap
# path) plus the seam (process/process_hooks.rs — three cold-path
# tables).
#
# Zero-move step: #[path]-includes of the service files living in the
# framework tree (kernel/src/process/); the physical moves are the
# later cosmetic step per the crate-plan recipe.

[dependencies]
rux-timer = { path = "../rux-timer", default-features = false }
# The sync union re-export (sync-upper lane): exit_teardown reaches
# the moved rwfz_dump_tgid at its historical path through rux-sync's
# union module (the allowed downward edge).
rux-sync = { path = "../rux-sync", default-features = false }
rux = { path = "..", default-features = false }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64", "rux-sync/riscv64"]
x86_64 = ["rux/x86_64", "rux-sync/x86_64"]
aarch64 = ["rux/aarch64", "rux-sync/aarch64"]
# Gates the guest test modules + their run entry (make test forwards
# this from rux-bin's unit-test through the SERVICE-TEST SEAM).
unit-test = ["rux/unit-test"]
