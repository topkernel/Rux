[package]
name = "rux-bin"
version = "0.1.0"
edition = "2021"

# The kernel BINARY package (crate-flip M3-B): owns the rust_main
# entry symbol and the final link (linker scripts + boot.S via its
# build.rs, moved from kernel/build.rs verbatim). Depends on the
# framework lib (rux) AND the service crate (rux-syscall) — the
# composition point, no cycles: rux-syscall -> rux <- rux-bin.

[[bin]]
name = "rux"
path = "src/main.rs"

[dependencies]
rux = { path = "..", default-features = false }
rux-syscall = { path = "../rux-syscall", default-features = false }
rux-net = { path = "../rux-net", default-features = false }
rux-sched-policy = { path = "../rux-sched-policy", default-features = false }

[build-dependencies]

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64", "rux-syscall/riscv64", "rux-net/riscv64", "rux-sched-policy/riscv64"]
x86_64 = ["rux/x86_64", "rux-syscall/x86_64", "rux-net/x86_64", "rux-sched-policy/x86_64"]
aarch64 = ["rux/aarch64", "rux-syscall/aarch64", "rux-net/aarch64", "rux-sched-policy/aarch64"]
# kernel lib features the bin/tests toggle: forwarded.
unit-test = ["rux/unit-test"]
cov-dump = ["rux/cov-dump"]
dfx-lock-owner = ["rux/dfx-lock-owner"]
