[package]
name = "rux-bin"
version = "0.1.0"
edition = "2021"

# The kernel BINARY package (crate-flip M3-B): owns the rust_main
# entry symbol and the final link (linker scripts + boot.S via its
# build.rs, moved from kernel/build.rs verbatim). Depends on the
# framework lib (rux) AND the service crate (rux-syscall) — the
# composition point, no cycles: rux-syscall -> rux <- rux-bin.

[[bin]]
name = "rux"
path = "src/main.rs"

[dependencies]
rux = { path = "..", default-features = false }
rux-syscall = { path = "../rux-syscall", default-features = false }
rux-net = { path = "../rux-net", default-features = false }
rux-sched = { path = "../rux-sched", default-features = false }
rux-fs = { path = "../rux-fs", default-features = false }
rux-drivers = { path = "../rux-drivers", default-features = false }
rux-mm = { path = "../rux-mm", default-features = false }

[build-dependencies]

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64", "rux-syscall/riscv64", "rux-net/riscv64", "rux-fs/riscv64", "rux-drivers/riscv64", "rux-mm/riscv64", "rux-sched/riscv64"]
x86_64 = ["rux/x86_64", "rux-syscall/x86_64", "rux-net/x86_64", "rux-fs/x86_64", "rux-drivers/x86_64", "rux-mm/x86_64", "rux-sched/x86_64"]
aarch64 = ["rux/aarch64", "rux-syscall/aarch64", "rux-net/aarch64", "rux-fs/aarch64", "rux-drivers/aarch64", "rux-mm/aarch64", "rux-sched/aarch64"]
# kernel lib features the bin/tests toggle: forwarded.
unit-test = ["rux/unit-test", "rux-fs/unit-test", "rux-mm/unit-test", "rux-net/unit-test", "rux-sched/unit-test"]
cov-dump = ["rux/cov-dump"]
dfx-lock-owner = ["rux/dfx-lock-owner"]
