[package]
name = "rux-syscall"
version = "0.1.0"
edition = "2021"

# The SYSCALL SERVICE CRATE (crate-flip M2, 2026-11-22): the 12 service
# files, #[path]-included from the framework side with ZERO moves; the
# crate-level forbid is the compiler-enforced service boundary.
#
# Standalone workspace like kernel/verify (the root pins kernel
# targets); path-depends on the rux framework LIB with feature
# pass-through (the arch feature must match the kernel build).

[workspace]

[dependencies]
rux = { path = ".." }

[features]
default = ["riscv64"]
riscv64 = ["rux/riscv64"]
x86_64 = ["rux/x86_64"]
aarch64 = ["rux/aarch64"]
